<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Database - Search</title>
    <style>
        /* --- Base & Background Styling --- */
        :root {
            --header-bg: #1e457d;
            --bg-color: #dcf4ff;
            --grid-color: #bce6fb;
            --text-dark: #1e3a8a;
            --text-gray: #4b5563;
        }

        body, html {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px; min-height: 100vh;
        }

        /* --- Header Navigation --- */
        .navbar { background-color: var(--header-bg); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { color: white; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
        .navbar-links { display: flex; gap: 30px; }
        .navbar-links a { color: #d1d5db; text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 1px; transition: color 0.3s ease; }
        .navbar-links a.active, .navbar-links a:hover { color: white; }

        /* --- Main Content & Logo --- */
        .main-container { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .school-logo { width: 160px; height: auto; margin-bottom: 10px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .school-title { color: var(--text-dark); font-family: Georgia, serif; font-size: 28px; margin-bottom: 30px; text-align: center;}

        /* --- Search Card --- */
        .search-card { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); width: 100%; max-width: 600px; text-align: center; margin-bottom: 30px; }
        .search-input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .search-input { width: 70%; padding: 12px 20px; border: 1px solid #d1d5db; border-radius: 50px; font-size: 15px; outline: none; }
        .search-input:focus { border-color: var(--header-bg); }
        
        .btn { background-color: var(--header-bg); color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #153463; }
        .btn-new { background-color: #10b981; margin-left: 10px; } /* Green color for new */
        .btn-new:hover { background-color: #059669; }

        /* --- Results Table --- */
        .results-container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); width: 100%; max-width: 900px; display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f3f4f6; color: var(--text-dark); padding: 12px; font-weight: 600; border-bottom: 2px solid var(--header-bg); }
        td { padding: 12px; border-bottom: 1px solid #e5e7eb; color: var(--text-gray); }
        tr:hover td { background-color: #f9fafb; }
        .no-results { text-align: center; padding: 20px; color: #ef4444; font-style: italic; }

        /* --- Login Modal --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 300px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { margin: 0; color: var(--text-dark); }
        .modal-content input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .close-btn { background: transparent; border: none; color: #ef4444; cursor: pointer; margin-top: 10px; text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">MT/KANDENUWARA T.M.V</div>
        <div class="navbar-links">
            <a href="#">ABOUT</a>
            <a href="#">ACADEMICS</a>
            <a href="#" class="active">STUDENTS DATABASE</a>
        </div>
    </nav>

    <div class="main-container">
        <img src="logo.jpg" alt="School Logo" class="school-logo" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
        <h1 class="school-title">MT/Kandenuwara T.M.V<br><span style="font-size: 16px; font-weight: normal;">(Tamil Maha Vidyalayam)</span></h1>
        
        <div class="search-card">
            <h2 style="color: #1e3a8a; margin-top:0;">Student Records</h2>
            <div class="search-input-group">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Name, Index, or Grade...">
                <button onclick="performSearch()" class="btn">Search</button>
                <button onclick="openModal()" class="btn btn-new">+ New</button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer">
            <table>
                <thead>
                    <tr>
                        <th>Index</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Term 1</th>
                        <th>Term 2</th>
                        <th>Term 3</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <h3>Admin Login</h3>
            <input type="text" id="adminId" placeholder="Admin ID">
            <input type="password" id="adminPass" placeholder="Password">
            <button class="btn" onclick="checkLogin()">Login</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
      // Dummy Database: Replace this array with a real database fetch later
        const studentsDb = [
            { index: "1001", name: "Kamal Perera", grade: "10", marks: 85 },
            { index: "1002", name: "Nimali Silva", grade: "10", marks: 92 },
            { index: "1003", name: "Saman Kumara", grade: "11", marks: 78 },
            { index: "1004", name: "Priyanka Fernando", grade: "11", marks: 88 },
            { index: "1005", name: "Ruwan Rajapaksha", grade: "12", marks: 95 },
            { index: "1006", name: "Anushka Sharma", grade: "10", marks: 65 },
            { index: "1007", name: "David Johnson", grade: "12", marks: 85 }
        ];

        // Allow pressing "Enter" key to search
        document.getElementById("searchInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                performSearch();
            }
        });

        function performSearch() {
            // Get the search query and convert to lowercase for case-insensitive matching
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('resultsContainer');
            const tableBody = document.getElementById('tableBody');

            // Clear previous results
            tableBody.innerHTML = '';

            // If search box is empty, hide the table and stop
            if (query === '') {
                resultsContainer.style.display = 'none';
                return;
            }

            // Pull fresh data from local storage
            const studentsDb = JSON.parse(localStorage.getItem('studentsDb'));

            const filtered = studentsDb.filter(s => 
                s.name.toLowerCase().includes(query) || s.index.includes(query) || s.grade === query
            );

            if (filtered.length > 0) {
                filtered.forEach(s => {
                    tableBody.innerHTML += `<tr>
                        <td><strong>${s.index}</strong></td>
                        <td>${s.name}</td><td>Grade ${s.grade}</td>
                        <td>${s.t1}</td><td>${s.t2}</td><td>${s.t3}</td>
                    </tr>`;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="6" class="no-results">No records found.</td></tr>`;
            }
            resultsContainer.style.display = 'block';
        }

        // --- Modal Login Logic ---
        function openModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('loginModal').style.display = 'none'; 
            document.getElementById('adminId').value = '';
            document.getElementById('adminPass').value = '';
        }
        
        function checkLogin() {
            const id = document.getElementById('adminId').value;
            const pass = document.getElementById('adminPass').value;
            
            if (id === "admin" && pass === "ktmv") {
                window.location.href = "add_student.html"; // Redirects to the new page
            } else {
                alert("Incorrect Admin ID or Password!");
            }
        }
    </script>
</body>
</html>
